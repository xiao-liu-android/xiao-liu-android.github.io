<!DOCTYPE html> 
<html>
<head>
    <meta charset="utf-8">
    <title>getCurrentPosition POC</title>
</head>
<body onload="go()">
    <button onclick="go()">getLocation</button>
    <pre id="log"></pre>

<script>
function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
}

function go() {
    // 动态申请定位权限
    location.href = "jsbridge://javacall/applyPermissions?callback=output&data=" + JSON.stringify(
        {"permissionList":["android.permission.ACCESS_FINE_LOCATION"],"requestCode":100}
    );

    if (!navigator.geolocation) {
        log('not supported');
        return;
    }

    navigator.geolocation.getCurrentPosition(
        pos => {
            const { latitude, longitude } = pos.coords;
            log(`latitude: ${latitude} longitude: ${longitude}`);
            alert(`latitude: ${latitude} longitude: ${longitude}`);
        },
        err => {
            log(`message: ${err.message} / code: ${err.code}`);
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}
</script>
</body>
</html>
